<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración — Comunidad SUTERM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="site-header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">CS</span>
      <span class="brand-name">Panel Administrativo</span>
    </a>
    <button id="btn-logout" class="btn secondary" style="display:none; padding:6px 12px; font-size:0.8rem;">Cerrar sesión</button>
  </div>
</header>

<main class="wrap">
  <!-- Login Section -->
  <section id="sec-login" class="admin-card" style="max-width:400px; margin:40px auto;">
    <h2 style="margin-bottom:16px; text-align:center;">Acceso Administrador</h2>
    <form id="form-login">
      <div class="form-group" style="margin-bottom:12px;">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn primary">Entrar</button>
      <p id="login-error" style="color:#dc2626; font-size:0.85rem; margin-top:10px; display:none;"></p>
    </form>
  </section>

  <!-- CRUD Panel Section -->
  <section id="sec-panel" style="display:none;">
    <div class="admin-card">
      <h2 id="form-title" style="margin-bottom:16px;">Publicar nuevo anuncio</h2>
      <form id="form-anuncio">
        <input type="hidden" id="anuncio-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="an-nombre">Nombre del negocio *</label>
            <input type="text" id="an-nombre" required>
          </div>
          <div class="form-group">
            <label for="an-categoria">Categoría *</label>
            <input type="text" id="an-categoria" placeholder="Ej. Alimentos, Mecánica, Legal" required>
          </div>
          <div class="form-group">
            <label for="an-seccion">Sección sindical *</label>
            <input type="text" id="an-seccion" placeholder="Ej. 150" required>
          </div>
          <div class="form-group">
            <label for="an-ciudad">Ciudad / Municipio *</label>
            <input type="text" id="an-ciudad" placeholder="Ej. Cuernavaca" required>
          </div>
          <div class="form-group">
            <label for="an-telefono">Teléfono (Llamadas)</label>
            <input type="text" id="an-telefono">
          </div>
          <div class="form-group">
            <label for="an-whatsapp">WhatsApp (10 dígitos)</label>
            <input type="text" id="an-whatsapp">
          </div>
          <div class="form-group full">
            <label for="an-direccion">Dirección física</label>
            <input type="text" id="an-direccion">
          </div>
          <div class="form-group full">
            <label for="an-descuento">Descuento o beneficio a agremiados</label>
            <input type="text" id="an-descuento" placeholder="Ej. 10% de descuento en mano de obra">
          </div>
          <div class="form-group">
            <label for="an-logo">URL del Logo (Tarjeta de inicio)</label>
            <input type="url" id="an-logo" placeholder="https://...">
          </div>
          <div class="form-group">
            <label for="an-imagen">URL Foto Principal / Banner</label>
            <input type="url" id="an-imagen" placeholder="https://...">
          </div>
          <div class="form-group full">
            <label for="an-video">Enlace de YouTube / Entrevista (opcional)</label>
            <input type="url" id="an-video" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="form-group full">
            <label>Galería de fotos adicionales (hasta 5):</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
              <input type="url" id="an-foto-1" placeholder="URL Foto 1">
              <input type="url" id="an-foto-2" placeholder="URL Foto 2">
              <input type="url" id="an-foto-3" placeholder="URL Foto 3">
              <input type="url" id="an-foto-4" placeholder="URL Foto 4">
              <input type="url" id="an-foto-5" placeholder="URL Foto 5">
            </div>
          </div>
          <div class="form-group full">
            <label for="an-descripcion">Descripción detallada</label>
            <textarea id="an-descripcion" rows="3"></textarea>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn primary" id="btn-save" style="width:auto;">Guardar anuncio</button>
          <button type="button" class="btn secondary" id="btn-cancel-edit" style="display:none; width:auto;">Cancelar edición</button>
        </div>
      </form>
    </div>

    <div class="admin-card">
      <h2 style="margin-bottom:16px;">Anuncios Registrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Negocio</th>
              <th>Sección</th>
              <th>Ciudad</th>
              <th>Categoría</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-anuncios-body">
            <tr><td colspan="5" style="text-align:center;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
